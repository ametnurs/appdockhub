<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Orbit: Quantum Core — Download di Google Play Store</title>
  <meta name="description" content="Mainkan game ketangkasan neon 60 FPS Cyber Orbit: Quantum Core di Android & kumpulkan reward saldo harian!" />
  <meta property="og:title" content="🎮 Cyber Orbit: Quantum Core — Official Android Game" />
  <meta property="og:description" content="Tembakkan node energi ke inti kuantum, taklukkan 2000 level, dan raih hadiah saldo harian! Download gratis di Google Play Store." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://appdockhub.com/play" />
  <style>
    :root { --bg: #050a14; --card: #0c1428; --cyan: #00f5ff; --orange: #ff6d00; --text: #f1f5f9; --muted: #94a3b8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 25%, #0f2042 0%, var(--bg) 70%);
      color: var(--text); padding: 20px; text-align: center;
    }
    .card {
      max-width: 440px; width: 100%; background: var(--card);
      border: 1.5px solid rgba(0, 245, 255, 0.3); border-radius: 24px;
      padding: 36px 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(0, 245, 255, 0.12);
    }
    .orbit-icon {
      width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 22px;
      background: radial-gradient(circle, #112240 0%, #050a14 100%);
      border: 2px solid var(--cyan); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 25px rgba(0, 245, 255, 0.35); position: relative;
    }
    .core { width: 28px; height: 28px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 16px var(--orange); }
    .ring {
      position: absolute; width: 64px; height: 64px; border-radius: 50%;
      border: 2px dashed var(--cyan); animation: spin 8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .badge {
      display: inline-block; padding: 4px 12px; border-radius: 99px;
      background: rgba(0, 245, 255, 0.12); color: var(--cyan);
      font-size: 11.5px; font-weight: 700; letter-spacing: 0.8px; margin-bottom: 10px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; color: #fff; }
    p { font-size: 14px; color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    .btn-play {
      display: block; width: 100%; padding: 15px 20px; border-radius: 14px;
      background: linear-gradient(135deg, #00e676 0%, #00bfa5 100%);
      color: #04120c; font-weight: 800; font-size: 16px; text-decoration: none;
      box-shadow: 0 8px 25px rgba(0, 230, 118, 0.35); transition: transform 0.15s;
    }
    .btn-play:active { transform: scale(0.98); }
    .status { font-size: 12px; color: var(--cyan); margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="orbit-icon">
      <div class="ring"></div>
      <div class="core"></div>
    </div>
    <span class="badge">GOOGLE PLAY STORE OFFICIAL</span>
    <h1>Cyber Orbit: Quantum Core</h1>
    <p>Game ketangkasan neon 60 FPS! Tembakkan node ke inti kuantum, taklukkan 2.000 level, dan kumpulkan hadiah saldo harian.</p>
    <a id="playStoreBtn" class="btn-play" href="https://play.google.com/store/apps/details?id=com.appdockhub.ecosystem">
      ▶ Download di Google Play Store
    </a>
    <div id="statusText" class="status">Mengarahkan otomatis ke Google Play Store...</div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var ref = (params.get('ref') || '').replace(/^ref_/, '').trim();
      var game = (params.get('game') || 'cyber_orbit').trim();
      var pkg = 'com.appdockhub.ecosystem';
      var playUrl = 'https://play.google.com/store/apps/details?id=' + pkg + (ref ? '&referrer=' + encodeURIComponent('ref_' + ref) : '');

      var btn = document.getElementById('playStoreBtn');
      if (btn) btn.href = playUrl;

      if (ref) {
        // Catat IP & Referrer ID ke Cloudflare Worker agar saat pemain membuka game langsung terikat ke pengundang
        fetch('https://api.appdockhub.com/api/referral/click?ref=' + encodeURIComponent(ref) + '&game=' + encodeURIComponent(game), {
          method: 'GET',
          mode: 'cors',
          keepalive: true
        }).catch(function() {}).finally(function() {
          setTimeout(function() { window.location.replace(playUrl); }, 900);
        });
      } else {
        setTimeout(function() { window.location.replace(playUrl); }, 900);
      }
    })();
  </script>
</body>
</html>
